# Include inside the HTTPS server for stevendz.tech.
location = /aulasmart {
    return 308 /aulasmart/$is_args$args;
}

location ^~ /aulasmart/ {
    limit_except GET { deny all; }

    proxy_pass https://stevendz2002.github.io/aulasmart-backend/;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    # Pages serves public assets. Browser credentials stay on this origin.
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host stevendz2002.github.io;
    proxy_set_header Content-Length "";
    proxy_hide_header Set-Cookie;
}
