spring.application.name=aulasmart-backend
# Carga la clave del .env local (ignorado por Git) para no exigirla por terminal en cada arranque
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/aulasmart_test}
spring.datasource.username=${DB_USERNAME:aulasmart}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

aulasmart.disponibilidad.max-antiguedad=PT24H

aulasmart.siga.base-url=https://uceva.datasae.co/siga_new/web/app.php
aulasmart.siga.timeout=PT15S
aulasmart.siga.programado.cron=0 0 4 * * *
aulasmart.siga.programado.zona=America/Bogota
