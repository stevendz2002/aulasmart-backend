spring.application.name=aulasmart-backend
aulasmart.aulabot.groq-key=${GROQ_API_KEY:}
aulasmart.aulabot.enabled=${AULASMART_AULABOT_ENABLED:false}
spring.profiles.default=local
aulasmart.auth.secret=${AULASMART_JWT_SECRET:}
aulasmart.auth.issuer=${AULASMART_JWT_ISSUER:aulasmart}
aulasmart.auth.access-ttl=${AULASMART_ACCESS_TTL:PT15M}
aulasmart.auth.refresh-ttl=${AULASMART_REFRESH_TTL:P7D}
aulasmart.auth.secure-cookie=true
aulasmart.security.allow-test-accounts=${AULASMART_ALLOW_TEST_ACCOUNTS:false}
# Carga la clave del .env local (ignorado por Git) para no exigirla por terminal en cada arranque
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/aulasmart_test}
spring.datasource.username=${DB_USERNAME:aulasmart}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

aulasmart.disponibilidad.max-antiguedad=PT24H

# Orígenes permitidos para la SPA Angular (preflight CORS) — configurable por entorno
aulasmart.cors.allowed-origins=${AULASMART_CORS_ORIGINS:http://localhost:4200}

aulasmart.siga.base-url=https://uceva.datasae.co/siga_new/web/app.php
aulasmart.siga.timeout=PT15S
aulasmart.siga.programado.cron=${AULASMART_SIGA_SYNC_CRON:0 */15 * * * *}
aulasmart.siga.programado.zona=America/Bogota

# Ventana de ocupación académica sincronizada: [hoy, hoy + dias-ventana)
aulasmart.siga.eventos.dias-ventana=7
aulasmart.siga.sincronizacion-inicial.enabled=${AULASMART_SIGA_SYNC_INICIAL_ENABLED:true}

