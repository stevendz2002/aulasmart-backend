# TLS termina en un proxy confiable; no exponer el backend directamente a Internet.
server.forward-headers-strategy=framework
aulasmart.auth.secure-cookie=true
aulasmart.security.allow-test-accounts=false
aulasmart.cors.allowed-origins=${AULASMART_CORS_ORIGINS}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
