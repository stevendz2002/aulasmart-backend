# CI/CD del frontend AulaSmart a GitHub Pages.
name: deploy-frontend

on:
  push:
    branches: [main]
    paths:
      - 'aulasmart-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aulasmart-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  AULASMART_API_ORIGIN: ${{ vars.AULASMART_API_ORIGIN || 'https://stevendz.tech' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: aulasmart-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aulasmart-frontend/package-lock.json

      - name: Dependencias
        run: npm ci

      - name: Pruebas
        run: npm test -- --watch=false

      - name: Configurar GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Compilar para GitHub Pages
        run: |
          npm run build:pages
          test -f dist/aulasmart-frontend/browser/index.html

      - name: Subir artefacto de GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: aulasmart-frontend/dist/aulasmart-frontend/browser/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verificar el sitio publicado
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          PUBLIC_URL: ${{ vars.AULASMART_PUBLIC_URL || 'https://aulasmart.stevendz.tech/' }}
        shell: bash
        run: |
          fetch() {
            curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' \
              --retry 6 --retry-all-errors --retry-delay 5 --max-time 15 "$1"
          }
          fetch "${PAGES_URL/#http:/https:}" > "$RUNNER_TEMP/pages.html"
          grep -Fq '<app-root>' "$RUNNER_TEMP/pages.html"
          fetch "$PUBLIC_URL" > "$RUNNER_TEMP/aulasmart.html"
          grep -Fq '<app-root>' "$RUNNER_TEMP/aulasmart.html"
          fetch "${AULASMART_API_ORIGIN%/}/actuator/health" > "$RUNNER_TEMP/health.json"
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"' "$RUNNER_TEMP/health.json"
