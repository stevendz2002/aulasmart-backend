# CI/CD del frontend AulaSmart a GitHub Pages.
name: deploy-frontend

on:
  push:
    branches: [main]
    paths:
      - 'aulasmart-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: aulasmart-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aulasmart-frontend/package-lock.json

      - name: Dependencias
        run: npm ci

      - name: Pruebas
        run: npm test -- --watch=false

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compilar para GitHub Pages
        run: |
          npm run build -- --configuration=production,pages
          test -f dist/aulasmart-frontend/browser/index.html

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: aulasmart-frontend/dist/aulasmart-frontend/browser/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
