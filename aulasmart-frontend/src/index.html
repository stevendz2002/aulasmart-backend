<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AulaSmart</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function(){try{var t=localStorage.getItem('aulasmart-theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}else if(window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
