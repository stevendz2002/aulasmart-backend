name: aulasmart

services:
  db:
    image: postgres:17.4-alpine
    container_name: aulasmart-postgres-test
    environment:
      POSTGRES_DB: aulasmart_test
      POSTGRES_USER: aulasmart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env local}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - aulasmart_pgdata_test:/var/lib/postgresql/data
      - ./database:/database
      - ./aulasmart-backend/src/main/resources/db/migration:/database/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aulasmart -d aulasmart_test"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  aulasmart_pgdata_test:
