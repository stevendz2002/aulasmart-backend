name: aulasmart

services:
  db:
    image: postgres:17.4-alpine
    container_name: aulasmart-postgres-test
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aulasmart_test}
      POSTGRES_USER: ${POSTGRES_USER:-aulasmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - aulasmart_pgdata_test:/var/lib/postgresql/data
      - ./database:/database
      - ./aulasmart-backend/src/main/resources/db/migration:/database/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aulasmart} -d ${POSTGRES_DB:-aulasmart_test}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    image: aulasmart-backend:latest
    build:
      context: ./aulasmart-backend
      dockerfile: Dockerfile
    container_name: aulasmart-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-aulasmart_test}
      DB_USERNAME: ${POSTGRES_USER:-aulasmart}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      SERVER_PORT: 8080
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AULASMART_AULABOT_ENABLED: ${AULASMART_AULABOT_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      AULASMART_JWT_SECRET: ${AULASMART_JWT_SECRET:-}
      AULASMART_JWT_ISSUER: ${AULASMART_JWT_ISSUER:-aulasmart}
      AULASMART_ACCESS_TTL: ${AULASMART_ACCESS_TTL:-PT15M}
      AULASMART_REFRESH_TTL: ${AULASMART_REFRESH_TTL:-P7D}
      AULASMART_SIGA_SYNC_CRON: ${AULASMART_SIGA_SYNC_CRON:-0 */15 * * * *}
      AULASMART_ALLOW_TEST_ACCOUNTS: ${AULASMART_ALLOW_TEST_ACCOUNTS:-false}
      AULASMART_CORS_ORIGINS: ${AULASMART_CORS_ORIGINS:-http://localhost:4200,http://localhost}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: aulasmart-frontend:latest
    build:
      context: ./aulasmart-frontend
      dockerfile: Dockerfile
    container_name: aulasmart-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  aulasmart_pgdata_test:
